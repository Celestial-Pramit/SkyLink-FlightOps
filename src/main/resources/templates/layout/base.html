<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="en">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title ?: 'SkyLink Ops'}">SkyLink Ops</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" th:href="@{/css/sidebar.css}">
    <link rel="stylesheet" th:href="@{/css/topbar.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <th:block th:replace="${pageCss} ?: ~{}"></th:block>
</head>
<body>
<div class="app-wrapper" th:fragment="layout(content)">
    <th:block th:replace="~{fragments/sidebar :: sidebar(${activePage})}"></th:block>
    <div id="sidebarOverlay" class="sidebar-overlay"></div>
    <div class="main-content">
        <th:block th:replace="~{fragments/topbar :: topbar(${pageTitle})}"></th:block>
        <th:block th:replace="~{fragments/flash :: flash}"></th:block>
        <th:block th:replace="${breadcrumb} ?: ~{}"></th:block>
        <main class="page-content">
            <th:block th:replace="${content} ?: ~{}"></th:block>
        </main>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script th:src="@{/js/sweetalert-utils.js}"></script>
<script th:src="@{/js/main.js}"></script>
<script th:src="@{/js/form-utils.js}"></script>
<th:block th:replace="${pageJs} ?: ~{}"></th:block>
</body>
</html>
