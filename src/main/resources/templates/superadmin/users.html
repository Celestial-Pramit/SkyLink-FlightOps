<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="en">
<head th:replace="~{layout/base :: head('User Management - SkyLink Ops')}"></head>
<body><div th:replace="~{layout/base :: layout(~{::main})}"><main>
    <link rel="stylesheet" th:href="@{/css/superadmin.css}">
    <div class="page-heading"><div><h1>User Management</h1><p>Manage administrator and staff access.</p></div><a class="btn-sky-primary" th:href="@{/superadmin/users/create}"><span class="material-symbols-outlined">person_add</span>Create admin</a></div>
    <div class="status-chips"><a class="status-chip" th:classappend="${selectedRole == 'all'} ? ' status-chip--active' : ''" th:href="@{/superadmin/users(role='all')}">All</a><a class="status-chip" th:classappend="${selectedRole == 'admin'} ? ' status-chip--active' : ''" th:href="@{/superadmin/users(role='admin')}">Admins <span class="chip-count" th:text="${adminCount}">0</span></a><a class="status-chip" th:classappend="${selectedRole == 'staff'} ? ' status-chip--active' : ''" th:href="@{/superadmin/users(role='staff')}">Staff <span class="chip-count" th:text="${staffCount}">0</span></a></div>
    <section class="sky-card"><div class="table-responsive"><table class="sky-table"><thead><tr><th>User</th><th>Role</th><th>Email</th><th>Status</th><th>Created</th><th class="text-end">Actions</th></tr></thead><tbody>
        <tr th:if="${#lists.isEmpty(users)}"><td colspan="6"><div class="sky-empty"><span class="material-symbols-outlined">group_off</span><p>No users found.</p></div></td></tr>
        <tr th:each="user : ${users}"><td><div class="user-cell"><span class="user-avatar" th:text="${user.initials}">U</span><strong th:text="${user.fullName}">User</strong></div></td><td th:text="${user.primaryRole}">Admin</td><td th:text="${user.email}">email</td><td><span class="badge-status" th:classappend="${user.statusCssClass}" th:text="${user.status != null ? user.status : 'UNKNOWN'}">ACTIVE</span></td><td th:text="${user.createdAt != null ? #temporals.format(user.createdAt, 'dd MMM yyyy') : '-'}">-</td><td class="text-end"><form class="inline-form" th:action="@{/superadmin/users/{id}/status(id=${user.id})}" method="post" onsubmit="return confirmStatus(this)"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input type="hidden" name="status" th:value="${user.status == T(com.skylink.app.enums.UserStatus).ACTIVE ? 'INACTIVE' : 'ACTIVE'}"><button class="btn-icon" type="submit" th:data-name="${user.fullName}" th:data-status="${user.status == T(com.skylink.app.enums.UserStatus).ACTIVE ? 'deactivate' : 'activate'}" title="Change status"><span class="material-symbols-outlined">toggle_on</span></button></form><form class="inline-form reset-form" th:action="@{/superadmin/users/{id}/reset(id=${user.id})}" method="post" onsubmit="return confirmReset(this)"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input type="hidden" name="newPassword" class="reset-password"><button class="btn-icon" type="submit" th:data-name="${user.fullName}" title="Reset password"><span class="material-symbols-outlined">key</span></button></form></td></tr>
    </tbody></table></div></section>
    <script>
        function confirmStatus(form) {
            var button = form.querySelector('button');
            var action = button.dataset.status;
            Swal.fire({
                title: action.charAt(0).toUpperCase() + action.slice(1) + ' account?',
                text: button.dataset.name,
                icon: action === 'deactivate' ? 'warning' : 'question',
                showCancelButton: true,
                confirmButtonColor: action === 'deactivate' ? '#ba1a1a' : '#68519d',
                confirmButtonText: action.charAt(0).toUpperCase() + action.slice(1),
                reverseButtons: true
            }).then(function (result) {
                if (result.isConfirmed) form.submit();
            });
            return false;
        }

        function confirmReset(form) {
            var button = form.querySelector('button');
            Swal.fire({
                title: 'Reset password',
                text: button.dataset.name,
                input: 'password',
                inputPlaceholder: 'New password (minimum 8 characters)',
                inputAttributes: { minlength: 8, autocomplete: 'new-password' },
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#68519d',
                confirmButtonText: 'Reset password',
                reverseButtons: true,
                inputValidator: function (value) {
                    return !value || value.length < 8
                        ? 'Password must be at least 8 characters.' : undefined;
                }
            }).then(function (result) {
                if (result.isConfirmed) {
                    form.querySelector('.reset-password').value = result.value;
                    form.submit();
                }
            });
            return false;
        }
    </script>
</main></div></body></html>
