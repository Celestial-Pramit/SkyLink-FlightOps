<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flight Schedule - SkyLink Ops</title>
    <link rel="stylesheet" th:href="@{/css/main.css}"><link rel="stylesheet" th:href="@{/css/sidebar.css}"><link rel="stylesheet" th:href="@{/css/topbar.css}"><link rel="stylesheet" th:href="@{/css/flights.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
</head>
<body>
<div class="app-wrapper">
    <th:block th:replace="~{fragments/sidebar :: sidebar('flights')}"></th:block>
    <div id="sidebarOverlay" class="sidebar-overlay"></div>
    <div class="main-content">
        <th:block th:replace="~{fragments/topbar :: topbar('Schedule')}"></th:block>
        <main class="page-content">
            <div class="sky-breadcrumb"><a th:href="@{/dashboard}">Dashboard</a><span class="sep material-symbols-outlined">chevron_right</span><a th:href="@{/flights}">Flights</a><span class="sep material-symbols-outlined">chevron_right</span><span>Schedule</span></div>
            <div class="cal-header">
                <a th:href="@{/flights/schedule(year=${prevMonth.year},month=${prevMonth.monthValue})}" class="btn-sky-ghost cal-nav"><span class="material-symbols-outlined">chevron_left</span></a>
                <div class="cal-month-title"><h1 class="page-header__title" th:text="${#temporals.format(currentMonth.atDay(1), 'MMMM yyyy')}">August 2026</h1><p class="page-header__sub"><span th:text="${#lists.size(flights)}">0</span> flights this month</p></div>
                <div class="cal-header-actions"><a th:href="@{/flights/schedule}" class="btn-sky-ghost">Today</a><a th:href="@{/flights/schedule(year=${nextMonth.year},month=${nextMonth.monthValue})}" class="btn-sky-ghost cal-nav"><span class="material-symbols-outlined">chevron_right</span></a></div>
            </div>

            <div class="cal-layout">
                <div class="sky-card calendar-card">
                    <div class="cal-grid cal-grid--header"><div class="cal-day-name">Mon</div><div class="cal-day-name">Tue</div><div class="cal-day-name">Wed</div><div class="cal-day-name">Thu</div><div class="cal-day-name">Fri</div><div class="cal-day-name">Sat</div><div class="cal-day-name">Sun</div></div>
                    <div class="cal-grid cal-grid--body">
                        <th:block th:if="${firstDay > 1}" th:each="i : ${#numbers.sequence(1, firstDay - 1)}"><div class="cal-cell cal-cell--empty"></div></th:block>
                        <th:block th:each="day : ${#numbers.sequence(1, daysInMonth)}">
                            <th:block th:with="currentDate=${currentMonth.atDay(day)}, dayFlights=${flights.?[departureTime.toLocalDate().equals(currentDate)]}">
                                <div class="cal-cell" th:classappend="${(currentDate.equals(todayDate) ? ' cal-cell--today' : '') + (!dayFlights.isEmpty() ? ' cal-cell--has-flights' : '') + (currentDate.isBefore(todayDate) ? ' cal-cell--past' : '')}" th:attr="data-day=${day},data-date=${currentDate}" th:onclick="${!dayFlights.isEmpty()} ? |selectDay('${currentDate}')| : null">
                                    <div class="cal-day-num"><span th:class="${currentDate.equals(todayDate)} ? 'cal-today-badge' : ''" th:text="${day}">1</span></div>
                                    <div th:if="${!dayFlights.isEmpty()}" class="cal-flight-badge"><span class="material-symbols-outlined">flight</span><span th:text="${dayFlights.size()}">3</span></div>
                                    <div class="cal-pills"><th:block th:each="f,iter : ${dayFlights}" th:if="${iter.index < 3}"><div class="cal-pill" th:classappend="|cal-pill--${f.status.name().toLowerCase()}|" th:text="${f.flightNumber}">BS-141</div></th:block><div th:if="${dayFlights.size() > 3}" class="cal-pill cal-pill--more">+<span th:text="${dayFlights.size() - 3}">1</span> more</div></div>
                                </div>
                            </th:block>
                        </th:block>
                    </div>
                </div>

                <aside id="calDetail" class="cal-detail">
                    <div class="cal-detail__header"><div><div id="detailDate" class="cal-detail__date">Select a day</div><div id="detailCount" class="cal-detail__count">-</div></div><button type="button" class="btn-icon" onclick="closeDetail()" aria-label="Close details"><span class="material-symbols-outlined">close</span></button></div>
                    <div id="detailList" class="cal-detail__list"><div class="calendar-detail-empty">Select a day with flights to see details.</div></div>
                    <sec:authorize access="hasRole('ADMIN')"><a th:href="@{/flights/add}" class="btn-sky-primary detail-add-button"><span class="material-symbols-outlined">add</span>Add flight</a></sec:authorize>
                </aside>
            </div>
        </main>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/main.js}"></script>
<script th:inline="javascript">
    const flightData = /*[[${flights}]]*/ [];
    const scheduleYear = /*[[${currentMonth.year}]]*/ 2026;
    const scheduleMonth = /*[[${currentMonth.monthValue}]]*/ 8;
</script>
<script th:src="@{/js/schedule.js}"></script>
</body>
</html>
