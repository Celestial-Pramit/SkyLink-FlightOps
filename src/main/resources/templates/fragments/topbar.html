<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<header class="topbar" th:fragment="topbar(pageTitle)">
    <div class="topbar-left">
        <button id="hamburgerBtn" class="btn-icon d-md-none" type="button" aria-label="Open navigation"><span class="material-symbols-outlined">menu</span></button>
        <div>
            <div class="topbar-greeting"><span id="greeting">Good morning</span>, <span sec:authentication="name">Admin</span></div>
            <h1 class="topbar-title" th:text="${pageTitle ?: 'Dashboard'}">Dashboard</h1>
        </div>
    </div>
    <div class="topbar-right">
        <div class="topbar-clock"><span class="material-symbols-outlined">schedule</span><span id="liveClock">--:--:--</span></div>
        <label class="topbar-search"><span class="material-symbols-outlined search-icon">search</span><input class="topbar-search-input" type="search" placeholder="Search..." id="globalSearch" aria-label="Search"></label>
        <button class="btn-icon topbar-notif" type="button" aria-label="Notifications"><span class="material-symbols-outlined">notifications</span><span class="notif-dot"></span></button>
        <div class="topbar-profile">
            <div class="topbar-avatar" th:text="${#strings.substring(#authentication.name,0,2).toUpperCase()}">AD</div>
            <div class="d-none d-md-block"><div class="topbar-user-name" sec:authentication="name">Admin</div><div class="topbar-user-role" sec:authorize="hasRole('ADMIN')">Administrator</div><div class="topbar-user-role" sec:authorize="hasRole('STAFF')">Receptionist</div><div class="topbar-user-role" sec:authorize="hasRole('SUPER_ADMIN')">Super Administrator</div></div>
        </div>
    </div>
</header>
</body>
</html>
