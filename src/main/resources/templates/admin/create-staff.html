<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en"><head th:replace="~{layout/base :: head('Add Staff - SkyLink Ops')}"></head>
<body><div th:replace="~{layout/base :: layout(~{::main})}"><main>
    <link rel="stylesheet" th:href="@{/css/superadmin.css}"><div class="page-heading"><div><h1>Add Staff Member</h1><p>Create an account for front-line operations.</p></div><a class="btn-sky-ghost" th:href="@{/admin/users}">Cancel</a></div>
    <form class="sky-card account-form" th:action="@{/admin/users/create}" th:object="${userDto}" method="post" enctype="multipart/form-data"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <div class="form-row-2"><div class="sky-form-group"><label class="sky-label" for="fullName">Full name *</label><input id="fullName" class="sky-input" th:field="*{fullName}" th:classappend="${#fields.hasErrors('fullName')} ? ' is-invalid'"><span class="sky-error-text" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></span></div><div class="sky-form-group"><label class="sky-label" for="email">Email *</label><input id="email" type="email" class="sky-input" th:field="*{email}" th:classappend="${#fields.hasErrors('email')} ? ' is-invalid'"><span class="sky-error-text" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span></div></div>
        <div class="form-row-2"><div class="sky-form-group"><label class="sky-label" for="phone">Phone</label><input id="phone" class="sky-input" th:field="*{phone}"></div><div class="sky-form-group"><label class="sky-label" for="password">Password *</label><input id="password" type="password" class="sky-input" th:field="*{password}" th:classappend="${#fields.hasErrors('password')} ? ' is-invalid'"><span class="sky-error-text" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></span></div></div>
        <div class="sky-form-group"><label class="sky-label" for="photoFile">Profile photo</label><input id="photoFile" type="file" class="sky-input" th:field="*{photoFile}" accept="image/*"></div><div class="form-actions"><a class="btn-sky-ghost" th:href="@{/admin/users}">Cancel</a><button class="btn-sky-primary" type="submit"><span class="material-symbols-outlined">save</span>Create staff account</button></div>
    </form>
</main></div></body></html>
