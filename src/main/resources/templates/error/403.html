<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>403 - Access Denied - SkyLink Ops</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
    <style>
        body { display:flex; align-items:center; justify-content:center; min-height:100vh; background:var(--background); }
        .error-page { text-align:center; padding:var(--space-2xl); max-width:480px; }
        .error-code { font:700 96px/1 var(--font-family); color:var(--outline-variant); letter-spacing:-.04em; margin-bottom:var(--space-md); }
        .error-icon { font-size:64px; color:var(--error); display:block; margin-bottom:var(--space-md); }
        .error-title { font:var(--font-headline-sm); color:var(--primary); margin-bottom:var(--space-sm); }
        .error-sub { font:var(--font-body-sm); color:var(--on-surface-variant); margin-bottom:var(--space-xl); line-height:1.6; }
    </style>
</head>
<body>
<div class="error-page">
    <div class="error-code">403</div>
    <span class="material-symbols-outlined error-icon">lock</span>
    <h1 class="error-title">Access Denied</h1>
    <p class="error-sub">You do not have permission to access this page. Contact your administrator if you believe this is a mistake.</p>
    <a th:href="@{/dashboard}" class="btn-sky-primary" style="display:inline-flex;align-items:center;gap:6px;padding:10px 24px">
        <span class="material-symbols-outlined">arrow_back</span> Back to Dashboard
    </a>
</div>
</body>
</html>
