spring:
  application:
    name: SkyLink

  datasource:
    url: jdbc:mysql://localhost:3306/skylink_db
    username: root
    password: 12345!!
    driver-class-name: com.mysql.cj.jdbc.Driver

  sql:
    init:
      mode: always
      continue-on-error: false

  jpa:
    defer-datasource-initialization: true
    open-in-view: false

    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  thymeleaf:
    cache: false

  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 5MB

server:
  port: 8088
  servlet:
    session:
      timeout: 30m
  error:
    whitelabel:
      enabled: false

app:
  upload:
    base-path: uploads/
