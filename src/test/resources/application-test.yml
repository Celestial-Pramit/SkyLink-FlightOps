spring:
  datasource:
    url: jdbc:h2:mem:skylink_test
    driver-class-name: org.h2.Driver
    username: sa
    password:

  sql:
    init:
      mode: never

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

app:
  upload:
    base-path: target/test-uploads/
